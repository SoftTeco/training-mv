apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  namespace: {{ .Values.env }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-mv
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/server-snippet: |
      location /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/html;
        try_files $uri =404;
      }
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.personal_fqdn }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docker-vue
            port:
              number: 80
      - path: /.well-known/acme-challenge/
        pathType: Prefix
        backend:
          service:
            name: cert-manager-webhook
            port:
              number: 8089
  tls:
  - hosts:
    - {{ .Values.personal_fqdn }}
    secretName: mv-tls-secret-key-and-crt
