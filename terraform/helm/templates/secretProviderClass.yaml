apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-csi-kv
  namespace: {{ .Values.env }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    #useVMManagedIdentity: "true"
    clientID: {{ .Values.user_assigned_client_id }}
    keyvaultName: {{ .Values.kv_name }}
    objects: |
      array:
      {{- range .Values.secrets }}
        - |
          objectName: {{ .name }}
          objectType: "secret"
      {{- end }}
    tenantID: {{ .Values.kv_tenant_id }}
    renewTime: 10m
  secretObjects:
  - data:
    - key: username
      objectName: newapplicationsecretuser
    secretName: newapplicationsecretuser
    type: Opaque
  - data:
    - key: password
      objectName: newapplicationsecretpassword
    secretName: newapplicationsecretpassword
    type: Opaque
