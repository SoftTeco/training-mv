apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-mv
  annotations:
    helm.sh/hook: pre-install
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory 
    email: {{ .Values.owner_email }}
    privateKeySecretRef:
      name: letsencrypt-key-only
    solvers:
    - http01:
        ingress:
          class: nginx
